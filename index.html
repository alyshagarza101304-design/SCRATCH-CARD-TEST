  const card = document.getElementById("card");
  const revealEl = document.getElementById("reveal");
  const canvas = document.getElementById("scratch");
  const ctx = canvas.getContext("2d");

  const frontImg = new Image();
  const revealImg = new Image();

  let drawing = false;
  let last = null;
  let ready = false;

  function loadImage(img, src) {
    return new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = src;
      if (img.complete && img.naturalWidth) resolve();
    });
  }

  function paintFront() {
    const rect = card.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);

    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.drawImage(frontImg, 0, 0, rect.width, rect.height);
    ready = true;
  }

  function point(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function erase(a, b) {
    if (!ready) return;
    const r = canvas.getBoundingClientRect();

    ctx.save();
    ctx.globalCompositeOperation = "destination-out";
    ctx.lineWidth = Math.max(32, r.width * 0.075);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.restore();
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (!ready) return;
    e.preventDefault();
    drawing = true;
    last = point(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    erase(last, {x: last.x + 0.1, y: last.y + 0.1});
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    e.preventDefault();
    const p = point(e);
    erase(last, p);
    last = p;
  });

  function stop() { drawing = false; last = null; }
  canvas.addEventListener("pointerup", stop);
  canvas.addEventListener("pointercancel", stop);

  Promise.all([
    loadImage(revealImg, REVEAL),
    loadImage(frontImg, FRONT)
  ]).then(() => {
    revealEl.src = REVEAL;
    paintFront();
  }).catch(() => {
    document.body.innerHTML = "<p style='padding:24px'>Card failed to load.</p>";
  });
})();

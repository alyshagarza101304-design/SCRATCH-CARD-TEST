<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Save Our Date</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f1e7;display:flex;justify-content:center}
.card{position:relative;width:min(100vw,540px);aspect-ratio:9/16}
img{position:absolute;width:100%;height:100%;object-fit:cover}
#reveal{z-index:1}
#front{z-index:2}
#scratch{position:absolute;z-index:3;left:27%;top:47.5%;width:46%;height:25.9%;border-radius:50%;touch-action:none}
</style>
</head>
<body>

<div class="card">
<img id="reveal" src="IMG_0489.png">
<img id="front" src="IMG_0488.png">
<canvas id="scratch"></canvas>
</div>

<script>
const f=document.getElementById("front");
const c=document.getElementById("scratch");
const x=c.getContext("2d");

function setup(){
let b=c.getBoundingClientRect();
c.width=b.width*2;
c.height=b.height*2;
x.scale(2,2);

x.drawImage(f,
f.naturalWidth*.27,
f.naturalHeight*.475,
f.naturalWidth*.46,
f.naturalHeight*.259,
0,0,b.width,b.height);

f.style.clipPath="polygon(0 0,100% 0,100% 100%,0 100%,0 47.5%,27% 47.5%,27% 73.4%,73% 73.4%,73% 47.5%,0 47.5%)";
}

f.onload=setup;
if(f.complete)setup();

let down=false,last;
  const music=new Audio("filtered-81212544-081C-4D86-9A9E-9E76F09148B7.MP4");
music.preload="auto";
let musicStarted=false;

function p(e){
let b=c.getBoundingClientRect();
return{x:e.clientX-b.left,y:e.clientY-b.top};
}

c.onpointerdown=e=>{
  down=true;
  last=p(e);

  if(!musicStarted){
    music.play();
    musicStarted=true;
  }

  c.setPointerCapture(e.pointerId);
};

c.onpointermove=e=>{
if(!down)return;
let q=p(e);
x.globalCompositeOperation="destination-out";
x.lineCap="round";
x.lineWidth=58;
x.beginPath();
x.moveTo(last.x,last.y);
x.lineTo(q.x,q.y);
x.stroke();
last=q;
};

c.onpointerup=c.onpointercancel=()=>down=false;
</script>

</body>
</html>
